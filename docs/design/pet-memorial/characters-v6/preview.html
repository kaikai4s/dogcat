<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纪念园 · 行走与待机</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#152823;color:#f5efdd;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:30px 22px}h1{font-size:28px;margin:8px 0 12px}p{color:#c4d0c4;line-height:1.8}small{color:#d4c38f}.note{padding:14px 18px;background:#29483a;border:1px solid #547257;border-radius:12px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}button,select{font:inherit;color:#fff2d8;background:#304d40;border:1px solid #67826a;border-radius:7px;padding:8px 12px}button{cursor:pointer}label{display:flex;align-items:center;gap:7px}input{accent-color:#e5c579}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ead18f}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #4b6c53;border-radius:14px;background:#294139;overflow:hidden;text-align:center}.panel h2{font-size:18px;font-weight:500;margin:18px 0 8px}.panel p{font-size:14px;margin:10px 16px 18px}canvas{display:block;max-width:100%;height:auto;margin:auto}.sheet{width:100%;display:block;border-radius:10px}details{margin:22px 0}summary{cursor:pointer;color:#eed799;margin:16px 0}a{color:#edd39a}.downloads{display:flex;gap:20px;flex-wrap:wrap}.status{font-size:14px}footer{margin-top:28px;border-top:1px solid #3e5d46;padding-top:18px}h2{font-size:20px}@media(max-width:650px){main{padding:20px 12px}.panels{grid-template-columns:1fr}.controls{gap:10px}h1{font-size:24px}}
</style><main><small>PET MEMORIAL GARDEN</small><h1>行走双手 · 与待机一致</h1><p>男角色 · 左前方　|　模型 <code>gpt-image-2.6-sunburst</code></p><p class="note">行走双手直接取自已认可的待机图，逐帧对齐手腕与摆臂方向。双手尺寸与袖口区分更清楚。</p><div class="controls"><label>动作<select id="action"><option value="walk">行走 · 清晰双手</option><option value="idle">待机 · 呼吸</option></select></label><button id="play">暂停</button><button id="prev" aria-label="上一帧">← 上一帧</button><button id="next" aria-label="下一帧">下一帧 →</button><label>逐帧<input id="frame" type="range" min="0" max="7" value="0"></label><output id="counter">1 / 8</output><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>底色<select id="bg"><option value="#456345">草绿色</option><option value="#202832">深色</option><option value="#eee8d9">浅色</option></select></label></div><div class="panels"><section class="panel"><h2 id="main-title">待机 · 呼吸与披风轻摆</h2><canvas id="main" width="312" height="416" aria-label="完整人物动作"></canvas><p id="timing">8 帧 / 2.4 秒循环</p></section><section class="panel"><h2>手部放大</h2><canvas id="detail" width="456" height="416" aria-label="手掌与手腕局部放大"></canvas><p>检查袖口连接、手掌轮廓和手指。</p></section></div><p class="status" id="status" role="status">正在加载素材…</p><details open><summary>手部修补前后对比</summary><p>上排为上一版，下排为采用待机双手后的行走。</p><img class="sheet" src="hands-before-after.jpg" alt="八帧手部修补前后对比"></details><details><summary>待机八帧</summary><img class="sheet" src="idle-contact.jpg" alt="八帧呼吸待机图"></details><details><summary>行走八帧</summary><img class="sheet" src="walk-contact.jpg" alt="八帧行走手部修整图"></details><footer><div class="downloads"><a href="../../../../output/imagegen/pet-memorial-sunburst-v6/pet-memorial-boy-sw-v6.zip">下载当前方向素材包</a><a href="walk.gif">行走 GIF</a><a href="idle.gif">待机 GIF</a><a href="manifest.json">帧参数与检查记录</a><a href="README.md">制作说明与提示词索引</a></div><p>本次素材范围为男角色左前方，尚未接入正式园区。</p></footer></main><script>
'use strict';
const $=id=>document.getElementById(id), images={}, durations={walk:125,idle:300};
let frame=0,paused=false,last=null,accum=0,loaded=0,failed=0;
function draw(){
 const action=$('action').value,im=images[action];
 $('counter').textContent=`${frame+1} / 8`;$('frame').value=frame;
 $('main-title').textContent=action==='idle'?'待机 · 呼吸与披风轻摆':'行走 · 保留步态，修补双手';
 $('timing').textContent=action==='idle'?'8 帧 / 2.4 秒循环':'8 帧 / 1 秒循环';
 for(const id of ['main','detail']){const c=$(id),ctx=c.getContext('2d');ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,c.width,c.height);if(!im?.complete||!im.naturalWidth)continue;
 const cw=im.naturalWidth/4,ch=im.naturalHeight/2,sx=frame%4*cw,sy=Math.floor(frame/4)*ch;
 if(id==='main')ctx.drawImage(im,sx,sy,cw,ch,0,0,c.width,c.height);
 else {const crop=action==='walk'?[68,181,152,92]:[79,158,136,101];const scale=Math.min((c.width-24)/crop[2],(c.height-36)/crop[3]);ctx.drawImage(im,sx+crop[0],sy+crop[1],crop[2],crop[3],(c.width-crop[2]*scale)/2,(c.height-crop[3]*scale)/2,crop[2]*scale,crop[3]*scale);}}
 $('status').textContent=failed?'素材加载失败，请检查文件是否完整。':`已加载 ${loaded}/2 套动作 · ${paused?'已暂停，可逐帧检查':'循环播放'} · 待机靴子已固定`;
}
for(const action of ['walk','idle']){const im=new Image();images[action]=im;im.onload=()=>{loaded++;draw()};im.onerror=()=>{failed++;draw()};im.src=`${action}-sw.png?v=6`;}
function pause(){paused=true;accum=0;$('play').textContent='播放';}
$('play').onclick=()=>{paused=!paused;accum=0;$('play').textContent=paused?'播放':'暂停';draw()};
$('frame').oninput=()=>{pause();frame=Number($('frame').value);draw()};
$('prev').onclick=()=>{pause();frame=(frame+7)%8;draw()};$('next').onclick=()=>{pause();frame=(frame+1)%8;draw()};
$('action').onchange=()=>{frame=0;accum=0;draw()};$('bg').onchange=draw;$('speed').onchange=()=>{accum=0;};
function tick(t){if(last===null)last=t;const dt=Math.min(t-last,200);last=t;if(!paused&&loaded===2){accum+=dt*Number($('speed').value);const duration=durations[$('action').value];if(accum>=duration){frame=(frame+Math.floor(accum/duration))%8;accum%=duration;draw()}}requestAnimationFrame(tick)}
draw();requestAnimationFrame(tick);
</script></html>
