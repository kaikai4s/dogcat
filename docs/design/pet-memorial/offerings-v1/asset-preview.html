<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纪念园 · 留一份心意</title><style>*{box-sizing:border-box}body{margin:0;background:#eff1e7;color:#42523c;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}small{letter-spacing:3px;color:#879274}h1{font-weight:500;font-family:serif;font-size:36px;margin:12px 0}p{font-size:14px;line-height:1.8;color:#7d866e}a{color:#536b45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fafaf2;border:1px solid #dce3cb;border-radius:24px;overflow:hidden;padding:24px}h2{font-size:17px;font-weight:500;margin:0}.poses{display:flex;justify-content:space-around;align-items:center;gap:12px;padding:10px 0}.poses canvas{width:min(46%,240px);height:auto}.labels{display:flex;justify-content:space-around;font-size:13px;color:#879274}.props{display:flex;gap:36px;justify-content:center}.props img{width:120px}.stage{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;margin-top:24px}#scene{width:100%;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,#aebd86,#809a66)}button{font:inherit;padding:12px 20px;border:0;border-radius:12px;background:#dfe7d1;color:#536b45;margin:5px;cursor:pointer}button+button{background:#ede0c5;color:#8b6e40}.counts{font-size:24px;line-height:2;color:#667950}.note{font-size:12px}.footer{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px}@media(max-width:700px){.grid,.stage{grid-template-columns:1fr}main{padding:24px 16px}header{display:block}h1{font-size:30px}}</style><main><header><div><small>A LITTLE LOVE, ALWAYS HERE</small><h1>留一束花，留一份想念。</h1><p>男女独立八帧动作 · 透明 PNG · 鲜花在左，零食在右</p></div><a href="memorial-offerings-upload.zip" download>下载云存储上传包 ↗</a></header><div class="grid"><section class="card"><h2>男生 · 轻轻放下心意</h2><div class="poses"><canvas data-sheet="boy-flower" width="256" height="256"></canvas><canvas data-sheet="boy-snack" width="256" height="256"></canvas></div><div class="labels"><span>献花</span><span>放零食</span></div></section><section class="card"><h2>女生 · 轻轻放下心意</h2><div class="poses"><canvas data-sheet="girl-flower" width="256" height="256"></canvas><canvas data-sheet="girl-snack" width="256" height="256"></canvas></div><div class="labels"><span>献花</span><span>放零食</span></div></section></div><section class="card stage"><canvas id="scene" width="440" height="360"></canvas><div><small>心意，在这里被记住</small><h2 style="margin-top:14px">小筑旁的摆放示意</h2><div class="counts" id="counts"></div><button id="flower">增加鲜花</button><button id="snack">增加零食</button><button id="expire">模拟场景供品到期</button><p class="note">到期只移除场景素材，累计总数保留。每侧逐件摆放，超过 12 件以密集花丛与准确数量显示。</p><div class="props"><img alt="奶白与淡桃色花束" src="preview-assets/flower.png"><img alt="宠物饼干零食盘" src="preview-assets/snack.png"></div></div></section><div class="footer"><a href="garden-card.png">查看小筑卡片</a><a href="garden-placement.png">查看实际场景摆放</a><a href="admin-settings.png">查看后台显示设置</a></div><p class="note">这里的增加与到期按钮用于查看美术效果。小程序中，每人每天对每处小筑可分别献花、放零食一次；后台分别设置显示时长。</p></main><script>const images={};for(const key of ['boy-flower','boy-snack','girl-flower','girl-snack','flower','snack','arch']){const img=new Image();img.src='preview-assets/'+key+'.png';images[key]=img}let frame=0;setInterval(()=>{for(const canvas of document.querySelectorAll('[data-sheet]')){const c=canvas.getContext('2d');c.clearRect(0,0,256,256);const img=images[canvas.dataset.sheet];if(img.complete)c.drawImage(img,frame%4*128,Math.floor(frame/4)*128,128,128,0,0,256,256)}frame=(frame+1)%8},300);let flower=3,snack=2,totalFlower=3,totalSnack=2;const scene=document.querySelector('#scene'),c=scene.getContext('2d');function draw(){c.clearRect(0,0,440,360);if(images.arch.complete)c.drawImage(images.arch,108,22,224,308);for(const [kind,count] of [['flower',flower],['snack',snack]]){for(let i=0;i<Math.min(count,12);i++){const x=220+(kind==='flower'?-1:1)*(72+i%3*22),y=278+Math.floor(i/3)*18;c.drawImage(images[kind],x-22,y-42,44,44)}if(count>12){c.fillStyle='#faf3d9';c.fillRect(kind==='flower'?103:275,337,62,20);c.fillStyle='#66533a';c.font='14px sans-serif';c.textAlign='center';c.fillText('×'+count,kind==='flower'?134:306,352)}}document.querySelector('#counts').textContent=totalFlower+' 束鲜花 · '+totalSnack+' 份零食'}document.querySelector('#flower').onclick=()=>{flower++;totalFlower++;draw()};document.querySelector('#snack').onclick=()=>{snack++;totalSnack++;draw()};document.querySelector('#expire').onclick=()=>{flower=snack=0;draw()};for(const img of Object.values(images))img.onload=draw;draw();</script></html>
